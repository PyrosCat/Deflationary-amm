[profile.default]
src = "contracts"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true

[lint]
# Test files use known-good project/mock tokens (revert-on-failure), so
# erc20-unchecked-transfer there is noise; and Pool.t.sol mirror-math must stay
# byte-identical to the contract's UQ112 oracle form (divide-before-multiply is
# deliberate there). Contract-side findings are handled by justified inline
# disable-next-line comments, never blanket-excluded.
ignore = ["test/**"]

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[fuzz]
runs = 256
