name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  publish:
    name: create GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          BODY=$(awk "/^## \[${VERSION}\]/{found=1; next} found && /^## \[/{exit} found{print}" CHANGELOG.md)
          echo "BODY<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Fail if CHANGELOG section is missing or empty
        env:
          BODY: ${{ steps.changelog.outputs.BODY }}
        run: |
          if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
            echo "::error file=CHANGELOG.md::No '## [${GITHUB_REF_NAME}]' section found (or it is empty). The GitHub Release body would be blank. Add the section, then re-cut the tag (docs/process/VERSION_CONTROL.md section 5 — a tag needing repair is a release-branch trigger)."
            exit 1
          fi

      - uses: foundry-rs/foundry-toolchain@v1

      - name: Build and verify
        run: forge build --sizes

      - name: Full test suite
        run: forge test -vvv

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.VERSION }}
          body: ${{ steps.changelog.outputs.BODY }}
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          generate_release_notes: false
