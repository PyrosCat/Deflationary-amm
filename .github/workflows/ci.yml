name: CI

# Build + test. One of the two required checks ("build & test") named in
# docs/process/VERSION_CONTROL.md; slither.yml is the other ("slither").
on:
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # lib/ dependencies are git submodules (see .gitmodules); Foundry
          # needs them present to compile.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show versions
        run: |
          forge --version
          # solc version is pinned in foundry.toml (0.8.24); forge resolves it.

      - name: Build (via-IR)
        # foundry.toml sets via_ir = true, optimizer 200. via-IR compilation is
        # slow (Session 2 noted ~252 s cold); the toolchain cache helps on
        # repeat runs.
        run: forge build --sizes

      - name: Test
        # Includes unit, integration, regression, invariant, and the Session 3
        # EpochLib suite. Baseline at time of writing: 70 tests across 8 suites.
        run: forge test -vvv
