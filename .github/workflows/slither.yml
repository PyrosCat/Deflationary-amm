name: Slither

# Static analysis — the third required check named in docs/VERSION_CONTROL.md.
# Uses the repo-root slither.config.json, so CI and local `slither .` agree.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: slither-${{ github.ref }}
  cancel-in-progress: true

jobs:
  slither:
    name: slither
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          # Slither compiles through Foundry, which needs the lib/ submodules.
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
          
      - name: Build (populate build-info)
        run: forge build --build-info

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        with:
          # Foundry is auto-detected; crytic-compile reads foundry.toml for
          # solc 0.8.24 + via-IR. slither.config.json (repo root) supplies
          # remappings, path filters, and dependency exclusion.
          slither-config: slither.config.json
          solc-version: "0.8.24"
          slither-version: "0.11.5"      
          # Fail the check on any finding not suppressed inline or filtered by
          # config. Tighten to 'Low'/'Medium' only if the baseline proves noisy;
          # per docs/STATIC-ANALYSIS.md the intent is a fully clean/justified run.
          fail-on: all
